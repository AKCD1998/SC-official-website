name: Apply approved Seamless production migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_011_SHOPEE_LEGACY_AUDIT to run the approved migration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seamless-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and verify production schema
    if: ${{ inputs.confirmation == 'APPLY_011_SHOPEE_LEGACY_AUDIT' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SC_OFFICIAL_SUPABASE_DATABASE_URL: ${{ secrets.SC_OFFICIAL_SUPABASE_DATABASE_URL }}
      SEAMLESS_PRODUCTION_MIGRATION_VERIFY: 011_shopee_legacy_reconciliation_apply_audit.sql
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply pending Seamless migrations
        run: npm run seamless:migrate

      - name: Verify approved migration read-only
        run: node ./scripts/verify-seamless-production-migration.cjs
