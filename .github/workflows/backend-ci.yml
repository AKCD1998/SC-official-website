name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/shopee-order-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/shopee-order-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest regression suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seamless_ci
          POSTGRES_USER: seamless_ci
          POSTGRES_PASSWORD: seamless_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seamless_ci -d seamless_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SC_OFFICIAL_SUPABASE_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/seamless_ci
      SEAMLESS_DB_SCHEMA: clasp_scx_seamless_ci
      SEAMLESS_MIGRATION_SMOKE: "1"
      SEAMLESS_MIGRATION_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/seamless_ci
      SEAMLESS_MIGRATION_TEST_SCHEMA: clasp_scx_seamless_review_ci
      CRM_COUNTER_POSTGRES_SMOKE: "1"
      SCCRM_REGISTRATION_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/crm_registration_test_ci
      SCCRM_IDENTITY_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/crm_registration_test_identity_ci
      SCCRM_HISTORY_FIRST_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/crm_history_first_test_ci
      SHOPEE004_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/seamless_ci
      SC_OFFICIAL_ADA_LINK_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/sccrm_ada_link_test_ci
      SC_OFFICIAL_FLEET_TEST_DATABASE_URL: postgresql://seamless_ci:seamless_ci@127.0.0.1:5432/crm_fleet_test_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The repository currently contains an orphaned gitlink with no matching
      # .gitmodules entry. Remove it from the ephemeral runner index so the
      # checkout action can clean up credentials without treating it as a
      # configured submodule. This does not change the checked-out commit.
      - name: Work around orphaned gitlink
        working-directory: .
        run: >-
          git update-index --force-remove --
          .claude/worktrees/awesome-pare-ca96e3
          .claude/worktrees/modest-johnson-105d4a
          .claude/worktrees/pedantic-rosalind-d1ee3a

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create isolated fleet-control database
        run: |
          node <<'NODE'
          const {Client}=require('pg');const db=new Client({connectionString:process.env.SC_OFFICIAL_SUPABASE_DATABASE_URL});
          (async()=>{try{await db.connect();await db.query('CREATE DATABASE crm_fleet_test_ci');await db.query('CREATE DATABASE crm_registration_test_identity_ci');await db.query('CREATE DATABASE crm_history_first_test_ci');}finally{await db.end();}})().catch(e=>{console.error(e.message);process.exit(1);});
          NODE

      - name: Apply Seamless migrations
        run: npm run seamless:migrate

      - name: Re-run Seamless migrations to prove idempotency
        run: npm run seamless:migrate

      - name: Verify Seamless migration contract
        run: npm run seamless:migrate:verify

      - name: Create isolated member-registration reporting database
        run: |
          node <<'NODE'
          const {Client}=require('pg');
          const db=new Client({connectionString:process.env.SC_OFFICIAL_SUPABASE_DATABASE_URL});
          (async()=>{try{await db.connect();await db.query('CREATE DATABASE crm_registration_test_ci');}finally{await db.end();}})().catch(error=>{console.error(error.message);process.exit(1);});
          NODE

      - name: Run backend tests
        run: npm test -- --testPathIgnorePatterns=backend-integration.test.cjs

      - name: Verify Ada member linking on a fresh isolated copy
        run: |
          node <<'NODE'
          const {Client}=require('pg');
          const db=new Client({connectionString:process.env.SC_OFFICIAL_SUPABASE_DATABASE_URL});
          (async()=>{try{await db.connect();await db.query('CREATE DATABASE sccrm_ada_link_test_ci');}finally{await db.end();}})().catch(error=>{console.error(error.message);process.exit(1);});
          NODE
          node scripts/check-ada-member-linking-copy.cjs

  contact-merge:
    name: Approved contact merge copy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SCCRM_CONTACT_MERGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sccrm_contact_merge_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --runTestsByPath tests/approved-member-merge.test.cjs tests/approved-member-merge-postgres.integration.test.cjs
