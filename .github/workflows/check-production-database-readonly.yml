name: Check production database connection (read only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-database-readonly-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Verify read-only production database connection
        working-directory: backend
        env:
          SC_OFFICIAL_SUPABASE_DATABASE_URL: ${{ secrets.SC_OFFICIAL_SUPABASE_DATABASE_URL }}
        run: node ./scripts/check-read-only-production-database.cjs
